<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CashSDK sandbox example</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <h1>CashSDK sandbox example</h1>
      <p>
        Local authentication, verified customer access, and Stripe subscription
        checkout preview.
      </p>
      <form id="login">
        <label for="password">Local example password</label
        ><input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        /><button type="submit">Sign in</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="account" hidden>
        <h2>Customer access</h2>
        <pre id="access"></pre>
        <button id="refresh" type="button">Refresh access</button
        ><button id="protected" type="button">Read protected resource</button
        ><button id="logout" type="button">Sign out</button>
        <h2>Offering</h2>
        <p>
          Checkout is disabled unless the marketplace operator enables the
          sandbox preview.
        </p>
        <div id="packages"></div>
      </section>
    </main>
  </body>
</html>
